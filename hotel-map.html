let city='bangkok',zoneId='silom',map=L.map('map',{zoomControl:true,preferCanvas:true});

 Object.entries(c.spots).forEach(([id,s])=>{const r=z.routes[id];L.polyline(r.points,{color:z.color,weight:4,opacity:.70,lineCap:'round',lineJoin:'round'}).addTo(routes).bindPopup(`<b>${z.name} → ${s.name}</b><br><span>${r.mode}<br>${r.time} · 道路约 ${r.km.toFixed(1)} km</span>`);const shop=s.kind==='购物';L.marker(s.coord,{icon:divIcon(`<div class="spot-pin ${shop?'shop':''}">${shop?'购':'景'}</div>`,[28,28],[14,14]),title:s.name}).addTo(layers).bindPopup(`<b>${s.name}</b><br><span>${s.kind}</span>`)});
 L.marker(z.coord,{zIndexOffset:1000,icon:divIcon(`<div class="pin" style="background:${z.color}"><span>⌂</span></div>`,[36,36],[18,34]),title:z.name}).addTo(layers).bindPopup(`<b>住宿中心：${z.name}</b><br><span>${z.short}</span>`).openPopup();

 document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{zoneId=b.dataset.zone;render()});document.querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>{const s=c.spots[b.dataset.spot];map.flyTo(s.coord,15,{duration:.7});layers.eachLayer(l=>{if(l.getLatLng&&Math.abs(l.getLatLng().lat-s.coord[0])<1e-5&&Math.abs(l.getLatLng().lng-s.coord[1])<1e-5)l.openPopup()})});}
